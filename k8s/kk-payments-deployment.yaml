# One Deployment manifest for every environment.
# scripts/deploy.sh fills the __PLACEHOLDERS__ from environments/common.env and
# environments/<env>.env; the namespace is chosen with -n and never written here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kk-payments
  labels:
    app: kk-payments
  annotations:
    kubernetes.io/change-cause: "__CHANGE_CAUSE__"
spec:
  replicas: __REPLICAS__
  revisionHistoryLimit: 10
  # A release that cannot become Ready within 2 minutes is marked failed,
  # so the pipeline's rollout check fails and the rollback runs.
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # Week 9 showed maxUnavailable: 1 drops capacity during a rollout.
      # 0 means an old Pod is removed only after its replacement is Ready.
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kk-payments
  template:
    metadata:
      labels:
        app: kk-payments
        version: "__VERSION__"
    spec:
      terminationGracePeriodSeconds: 20
      imagePullSecrets:
        - name: __PULL_SECRET_NAME__
      containers:
        - name: kk-payments
          image: __IMAGE__
          ports:
            - name: http
              containerPort: 3001
          # APP_ENV and DB_HOST come from the environment's ConfigMap (Ansible)
          envFrom:
            - configMapRef:
                name: __CONFIGMAP_NAME__
          # Ready = /health answers, so traffic only reaches Pods that can serve
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          # Live = still answering; restart the container if it stops
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
