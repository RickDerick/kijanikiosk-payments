apiVersion: apps/v1
kind: Deployment
metadata:
  name: kk-payments
  annotations:
    kubernetes.io/change-cause: "Update kk-payments to 1.1.0: fix payment processing latency"
  labels:
    app: kk-payments
    week: "9"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1           # at most 4 Pods during the update
      maxUnavailable: 1     # at least 2 Pods serving at all times
  selector:
    matchLabels:
      app: kk-payments            # must match template labels below
  template:
    metadata:
      labels:
        app: kk-payments          # must match selector above
        version: "1.1.0-84c9e6e"
    spec:
      imagePullSecrets:
        - name: kijani-registry-credentials   # reference only, never the token
      containers:
        - name: kk-payments
          image: docker.io/derickharon/kk-payments:1.1.0-84c9e6e
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
