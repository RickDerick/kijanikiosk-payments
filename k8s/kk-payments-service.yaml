# NodePort Service; the port differs per environment because NodePorts are cluster-wide.
apiVersion: v1
kind: Service
metadata:
  name: kk-payments-service
  labels:
    app: kk-payments
spec:
  type: NodePort
  selector:
    app: kk-payments
  ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: http
      nodePort: __NODE_PORT__
